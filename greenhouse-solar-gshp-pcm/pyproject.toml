[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-gshp"
version = "1.0.0"
description = "Reproducible model of a solar-assisted ground-source heat pump with PCM storage for greenhouse heating (M.Sc. thesis, Uludag University)"
authors = [{ name = "Hakan Karademir" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
